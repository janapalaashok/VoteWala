# Builds the web and migration images. Invoked by deploy/gcp/deploy.sh.
steps:
  - id: migrate-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "migrate", "-t", "${_REPO}/migrate:${_TAG}", "."]
  - id: web-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "runner", "-t", "${_REPO}/web:${_TAG}", "."]
images:
  - "${_REPO}/migrate:${_TAG}"
  - "${_REPO}/web:${_TAG}"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s

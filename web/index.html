<!DOCTYPE html>
<html>
<head>

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VoteWala is Andhra Pradesh's public opinion platform: vote in monthly MLA and MP polls, statewide polls and rate local facilities. Free, one verified vote per person.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Link previews (WhatsApp, Facebook, X, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VoteWala">
  <meta property="og:url" content="https://votewala.in/">
  <meta property="og:title" content="VoteWala – Andhra Pradesh's Public Opinion Platform">
  <meta property="og:description" content="Vote in monthly MLA and MP polls and statewide polls. Free, one verified vote per person. మీ అభిప్రాయం. మీ ఎంపిక.">
  <meta property="og:image" content="https://votewala.in/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_IN">
  <meta property="og:locale:alternate" content="te_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VoteWala – Andhra Pradesh's Public Opinion Platform">
  <meta name="twitter:description" content="Vote in monthly MLA and MP polls and statewide polls. Free, one verified vote per person.">
  <meta name="twitter:image" content="https://votewala.in/og-image.jpg">
  <link rel="canonical" href="https://votewala.in/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VoteWala">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VoteWala – Andhra Pradesh Public Opinion Polls</title>
  <meta name="theme-color" content="#F47A1F">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

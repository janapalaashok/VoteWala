name: Reset admin password

# Sets the admin's password to the ADMIN_RESET_PASSWORD secret (you choose it
# in Settings -> Secrets and variables -> Actions). The admin must change it on
# the next sign-in. Run it from the Actions tab (Run workflow).
on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Admin username'
        required: false
        default: 'admin'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
          ADMIN_USERNAME: ${{ inputs.username }}
        run: |
          pip install google-auth requests
          python3 tools/reset_admin_password.py

name: Deploy security rules

# Publishes firestore.rules and storage.rules after the emulator tests pass.
# Manual only: run it from the Actions tab once a release is approved.
on:
  # A release is approved by editing hosting/RULES_RELEASE; code pushes never deploy.
  push:
    paths: [hosting/RULES_RELEASE]
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: test/rules
        run: (npm ci || npm install) && npm test
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install google-auth requests
          python3 tools/deploy_rules.py

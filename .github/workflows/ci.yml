name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: votewala
          POSTGRES_PASSWORD: votewala
          POSTGRES_DB: votewala_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U votewala" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://votewala:votewala@localhost:5432/votewala_test
      TEST_DATABASE_URL: postgresql://votewala:votewala@localhost:5432/votewala_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

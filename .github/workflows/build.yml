name: Build

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk VoteWala.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoteWala-apk
          path: VoteWala.apk
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: VoteWala test build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Test APK built from ${{ github.ref_name }} @ ${{ github.sha }}.
            Signed with the debug key: for testing only, not for the Play Store.
          files: VoteWala.apk

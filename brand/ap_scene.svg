<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1A4D"/>
      <stop offset="0.35" stop-color="#6B2F7E"/>
      <stop offset="0.62" stop-color="#E3605A"/>
      <stop offset="0.80" stop-color="#FFA552"/>
      <stop offset="1" stop-color="#FFD27A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF8D6"/>
      <stop offset="0.55" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59A5E"/>
      <stop offset="0.25" stop-color="#B9617A"/>
      <stop offset="0.6" stop-color="#3E4F86"/>
      <stop offset="1" stop-color="#1F3563"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CF94"/>
      <stop offset="1" stop-color="#D99A5B"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A4E3A"/>
      <stop offset="0.45" stop-color="#F2C98C"/>
      <stop offset="1" stop-color="#C98552"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1B5"/>
      <stop offset="0.5" stop-color="#F5B83A"/>
      <stop offset="1" stop-color="#B9721C"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B3F7A"/>
      <stop offset="1" stop-color="#B85A6E"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2150"/>
      <stop offset="1" stop-color="#25163A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4C2" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF4C2" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="160" cy="70" r="1.6"/><circle cx="340" cy="40" r="1.2"/><circle cx="520" cy="95" r="1.4"/>
    <circle cx="760" cy="30" r="1.1"/><circle cx="980" cy="80" r="1.5"/><circle cx="1210" cy="45" r="1.3"/>
    <circle cx="1420" cy="100" r="1.6"/><circle cx="1540" cy="35" r="1.1"/><circle cx="640" cy="150" r="1"/>
  </g>
  <!-- clouds -->
  <g fill="#FFC9A3" opacity="0.35">
    <ellipse cx="380" cy="260" rx="210" ry="18"/><ellipse cx="470" cy="245" rx="120" ry="14"/>
    <ellipse cx="1270" cy="300" rx="240" ry="16"/><ellipse cx="1180" cy="286" rx="110" ry="12"/>
    <ellipse cx="860" cy="200" rx="150" ry="10"/>
  </g>

  <!-- sun -->
  <circle cx="1000" cy="560" r="300" fill="url(#glow)"/>
  <circle cx="1000" cy="560" r="105" fill="url(#sun)"/>

  <!-- far Eastern Ghats -->
  <path d="M0 520 C 120 470 220 500 330 455 C 430 420 520 470 620 470 C 760 470 820 520 940 545 L 1600 560 L 1600 600 L 0 600 Z" fill="url(#hillFar)" opacity="0.85"/>
  <path d="M1080 560 C 1180 520 1260 470 1360 470 C 1450 470 1520 430 1600 440 L 1600 600 L 1060 600 Z" fill="#8E4672" opacity="0.8"/>

  <!-- sea -->
  <rect y="560" width="1600" height="340" fill="url(#sea)"/>
  <!-- sun reflection -->
  <g fill="#FFE29A">
    <rect x="930" y="568" width="140" height="5" rx="2.5" opacity="0.9"/>
    <rect x="950" y="586" width="100" height="4" rx="2" opacity="0.8"/>
    <rect x="915" y="604" width="170" height="4" rx="2" opacity="0.6"/>
    <rect x="960" y="624" width="80" height="4" rx="2" opacity="0.6"/>
    <rect x="930" y="646" width="140" height="3" rx="1.5" opacity="0.45"/>
    <rect x="975" y="670" width="50" height="3" rx="1.5" opacity="0.45"/>
    <rect x="945" y="696" width="110" height="3" rx="1.5" opacity="0.3"/>
  </g>
  <!-- waves -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.35" stroke-width="2.4">
    <path d="M120 640 q 20 -8 40 0 t 40 0"/><path d="M420 700 q 25 -9 50 0 t 50 0"/>
    <path d="M700 660 q 18 -7 36 0 t 36 0"/><path d="M1240 650 q 22 -8 44 0 t 44 0"/>
    <path d="M1380 720 q 25 -9 50 0 t 50 0"/><path d="M820 740 q 25 -9 50 0 t 50 0"/>
    <path d="M260 760 q 22 -8 44 0 t 44 0"/>
  </g>

  <!-- fishing boats -->
  <g fill="#2A1B3D">
    <path d="M760 612 l 60 0 l -10 9 l -42 0 z"/><path d="M790 612 l 0 -46 l 22 40 z" fill="#3B2552"/>
    <path d="M1180 628 l 80 0 l -14 11 l -54 0 z"/><path d="M1220 628 l 0 -60 l 30 52 z" fill="#3B2552"/>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#2A1B3D" stroke-width="3" stroke-linecap="round">
    <path d="M700 300 q 12 -10 24 0 q 12 -10 24 0"/><path d="M760 270 q 9 -8 18 0 q 9 -8 18 0"/>
    <path d="M820 320 q 10 -9 20 0 q 10 -9 20 0"/>
  </g>

  <!-- right headland with lighthouse (Vizag) -->
  <path d="M1600 470 C 1540 470 1500 520 1450 545 C 1410 565 1385 585 1360 600 L 1600 600 Z" fill="url(#hillNear)"/><path d="M1360 600 L 1600 600 L 1600 616 C 1520 612 1440 610 1360 600 Z" fill="#2A1B3D" opacity="0.35"/>
  <path d="M1500 461 L 1100 380 L 1100 420 Z" fill="url(#beam)" opacity="0.6"/>
  <g>
    <path d="M1488 470 L 1512 470 L 1518 560 L 1482 560 Z" fill="#FDF6EE"/>
    <path d="M1486 496 L 1514 496 L 1515 512 L 1485 512 Z" fill="#D9473C"/>
    <path d="M1484 528 L 1516 528 L 1517 544 L 1483 544 Z" fill="#D9473C"/>
    <rect x="1484" y="452" width="32" height="18" rx="3" fill="#FFE6A0"/>
    <path d="M1480 452 L 1500 432 L 1520 452 Z" fill="#D9473C"/>
    <circle cx="1500" cy="461" r="9" fill="#FFFBE0"/>
  </g>

  <!-- left hill (Tirumala) -->
  <path d="M0 430 C 90 400 170 390 260 405 C 360 420 430 470 520 520 C 570 548 610 575 650 600 L 0 600 Z" fill="url(#hillNear)"/><path d="M0 600 L 650 600 C 520 616 260 618 0 614 Z" fill="#2A1B3D" opacity="0.35"/><path d="M0 601 L 650 601" stroke="#FFD9A8" stroke-width="2" opacity="0.5"/>

  <!-- Tirumala gopuram -->
  <g transform="translate(150 132)">
    <!-- base -->
    <rect x="0" y="240" width="190" height="40" fill="url(#stone)"/>
    <rect x="72" y="244" width="46" height="36" rx="18" fill="#3A2150"/>
    <!-- tiers -->
    <path d="M6 240 L 184 240 L 176 210 L 14 210 Z" fill="url(#stone)"/>
    <path d="M16 210 L 174 210 L 166 182 L 24 182 Z" fill="url(#stone)"/>
    <path d="M26 182 L 164 182 L 157 156 L 33 156 Z" fill="url(#stone)"/>
    <path d="M35 156 L 155 156 L 148 132 L 42 132 Z" fill="url(#stone)"/>
    <path d="M44 132 L 146 132 L 140 110 L 50 110 Z" fill="url(#stone)"/>
    <path d="M52 110 L 138 110 L 132 90 L 58 90 Z" fill="url(#stone)"/>
    <g stroke="#7A3F2C" stroke-width="2" opacity="0.6">
      <line x1="14" y1="210" x2="176" y2="210"/><line x1="24" y1="182" x2="166" y2="182"/>
      <line x1="33" y1="156" x2="157" y2="156"/><line x1="42" y1="132" x2="148" y2="132"/>
      <line x1="50" y1="110" x2="140" y2="110"/><line x1="58" y1="90" x2="132" y2="90"/>
    </g>
    <g fill="#7A3F2C" opacity="0.55">
      <rect x="40" y="218" width="10" height="16"/><rect x="90" y="218" width="10" height="16"/><rect x="140" y="218" width="10" height="16"/>
      <rect x="50" y="162" width="9" height="14"/><rect x="90" y="162" width="9" height="14"/><rect x="130" y="162" width="9" height="14"/>
      <rect x="66" y="116" width="8" height="11"/><rect x="91" y="116" width="8" height="11"/><rect x="116" y="116" width="8" height="11"/>
    </g>
    <!-- barrel roof -->
    <path d="M54 90 L 136 90 L 136 76 C 136 60 54 60 54 76 Z" fill="url(#gold)"/>
    <g fill="url(#gold)">
      <path d="M66 62 l 6 -18 l 6 18 z"/><path d="M86 60 l 6 -20 l 6 20 z"/><path d="M106 60 l 6 -20 l 6 20 z"/><path d="M124 62 l 5 -16 l 5 16 z"/>
    </g>
  </g>
  <!-- golden vimana (Ananda Nilayam) -->
  <g transform="translate(372 352)">
    <rect x="0" y="62" width="90" height="40" fill="url(#gold)"/>
    <path d="M6 62 L 84 62 L 76 40 L 14 40 Z" fill="url(#gold)"/>
    <path d="M18 40 L 72 40 C 72 10 18 10 18 40 Z" fill="url(#gold)"/>
    <path d="M42 14 l 3 -14 l 3 14 z" fill="#FFF1B5"/>
    
  </g>

  <!-- beach -->
  <path d="M0 800 C 300 770 520 790 800 800 C 1100 812 1350 780 1600 770 L 1600 900 L 0 900 Z" fill="url(#sand)"/>
  <path d="M0 800 C 300 770 520 790 800 800 C 1100 812 1350 780 1600 770" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.6"/>

  <!-- palms -->
  <g>
    <path d="M90 900 C 110 820 120 760 150 690" stroke="#3A2150" stroke-width="16" fill="none" stroke-linecap="round"/>
    <g fill="#2E5D3A">
      <path d="M150 690 C 100 670 60 690 30 720 C 80 690 120 692 150 700 Z"/>
      <path d="M150 690 C 190 650 240 650 280 670 C 230 662 190 672 152 700 Z"/>
      <path d="M150 690 C 130 640 140 610 170 590 C 155 630 160 660 158 694 Z"/>
      <path d="M150 690 C 200 690 240 720 250 760 C 220 725 190 708 150 700 Z"/>
      <path d="M150 690 C 110 700 80 740 80 780 C 100 740 120 716 152 700 Z"/>
    </g>
    <path d="M1500 900 C 1490 840 1470 790 1440 740" stroke="#3A2150" stroke-width="13" fill="none" stroke-linecap="round"/>
    <g fill="#2E5D3A">
      <path d="M1440 740 C 1400 720 1360 730 1330 760 C 1370 735 1410 738 1440 750 Z"/>
      <path d="M1440 740 C 1470 705 1520 700 1560 718 C 1515 712 1475 725 1442 750 Z"/>
      <path d="M1440 740 C 1430 700 1445 670 1470 655 C 1455 690 1455 715 1446 750 Z"/>
      <path d="M1440 740 C 1480 745 1510 770 1515 805 C 1490 775 1465 760 1440 750 Z"/>
    </g>
  </g>
</svg>

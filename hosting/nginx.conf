# Same caching as the Firebase Hosting setup: the page itself is never
# cached, so a new release is picked up on the next visit.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # App code keeps fixed file names: always check for a new release.
  location ~* \.(js|mjs|json)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location ~* \.(wasm|png|jpg|webp|otf|ttf)$ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Routes use #/..., so every other path serves the app.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }
}
